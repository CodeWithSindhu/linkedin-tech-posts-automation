name: Generate LinkedIn Draft

on:
  schedule:
    # 09:00 Asia/Kolkata (03:30 UTC) every day
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      max_article_age_hours:
        description: "Maximum article age in hours"
        required: false
        default: "72"

permissions:
  contents: write

concurrency:
  group: linkedin-draft-generator
  cancel-in-progress: false

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate generator
        run: |
          python -m py_compile src/generate_draft.py
          python -m unittest discover -s tests -v

      - name: Generate draft
        env:
          MAX_ARTICLE_AGE_HOURS: ${{ inputs.max_article_age_hours || '72' }}
        run: python src/generate_draft.py

      - name: Upload draft artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-post-draft
          path: drafts/
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts/
          if git diff --cached --quiet; then
            echo "No draft changes to commit."
          else
            git commit -m "chore: generate LinkedIn draft"
            git push
          fi
